services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: ats, POSTGRES_PASSWORD: ats, POSTGRES_DB: ats}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ats"], interval: 3s, retries: 20}
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ats:ats@db:5432/ats
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && python /scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: ["./scripts:/scripts:ro"]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
